# Workboard only reads from the sources it connects to, so a reqwest call
# that can send any other method is refused here, in the service and in the
# GNOME app alike. Each use is an explicit exception with a reason: the
# CLI's and the GNOME app's calls to their own local service, and the
# one send of each read-only client, which checks every request first:
# GitHub's and Forgejo's, and the companion's client of its hub, which only
# GETs the hub's export.
#
# A reqwest request goes out through `Client::execute`, the tower `Service`
# that `Client` and `&Client` implement, or `RequestBuilder::send`. The first
# two send a `Request` of any method, so both are refused. A builder only
# comes from `get` and `head`, which can't write, or from the methods below.
disallowed-methods = [
  { path = "reqwest::Client::post", reason = "sources are read-only" },
  { path = "reqwest::Client::put", reason = "sources are read-only" },
  { path = "reqwest::Client::patch", reason = "sources are read-only" },
  { path = "reqwest::Client::delete", reason = "sources are read-only" },
  { path = "reqwest::Client::request", reason = "sources are read-only; it takes any method" },
  { path = "reqwest::Client::execute", reason = "sources are read-only; it sends a request of any method" },
  { path = "tower_service::Service::call", reason = "sources are read-only; reqwest's Client sends a request of any method through it" },
  { path = "reqwest::RequestBuilder::from_parts", reason = "sources are read-only; it sends a request of any method" },
  { path = "reqwest::Request::method_mut", reason = "sources are read-only" },
]
