[workspace]
# The service is the root package, and what a plain `cargo build` builds.
# The GNOME app needs GTK and libadwaita to build, so it is built only when
# asked for (`-p workboard-gnome` or `--workspace`).
members = [".", "gnome"]
default-members = ["."]

[package]
name = "workboard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A personal work inbox across Jira, GitLab and downstream release work"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
graphql-parser = "0.4"
http-body-util = "0.1"
# The CLI's client of the service's socket, which checks the service on
# each connection before it sends a request there.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ring = "0.17"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

# The Secret Service (GNOME Keyring), for data directories that keep the
# credentials there (`workboard credentials migrate --to keyring`).
[target.'cfg(target_os = "linux")'.dependencies]
oo7 = "0.6"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

