# Branch rules can't be enforced on this free private repository, so
# merging waits on the `ci` job (at the end) by process. It gates on all
# the others, so jobs can be added or split here without changing what
# "green" means.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo fmt
        run: cargo fmt --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rust-embed embeds web/dist, so the web build comes before cargo.
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Web build
        working-directory: web
        run: npm run build
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked
      - name: cargo build
        run: cargo build --locked
      # The unit tests' own binary, for the ignored live tests, such as the
      # anonymous read of a public repository on Fedora Forge. Picked by
      # its kind, so a library or integration tests added later don't
      # change which one it is.
      - name: Keep the test binary
        run: |
          TESTS=$(cargo test --locked --no-run --message-format=json | jq -rs '[.[] | select(.profile.test? and .executable and .target.kind == ["bin"])] | if length == 1 then .[0].executable else error("expected one bin test executable, found \(length)") end')
          cp "${TESTS}" target/debug/workboard-tests
      # For live tests on a machine that only runs what CI built.
      - name: Upload the debug binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workboard-debug
          path: |
            target/debug/workboard
            target/debug/workboard-tests
          retention-days: 1
          if-no-files-found: error
      - name: Smoke test
        run: python3 tests/smoke.py target/debug/workboard

  # The one job that decides whether a change may merge. It runs always(),
  # even when a job it needs failed or the run was cancelled, and fails
  # unless every job it needs succeeded. List every job above in needs.
  ci:
    if: always()
    needs: [fmt, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check the jobs it needs
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          FAILED=$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<<"${NEEDS}")
          if [ -n "${FAILED}" ]; then
            echo "These jobs did not succeed: ${FAILED}"
            exit 1
          fi
