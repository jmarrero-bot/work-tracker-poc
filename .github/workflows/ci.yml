# Branch rules can't be enforced on this free private repository, so
# merging waits on the `ci` job (at the end) by process. It gates on all
# the others, so jobs can be added or split here without changing what
# "green" means.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo fmt
        run: cargo fmt --all --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rust-embed embeds web/dist, so the web build comes before cargo.
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Web build
        working-directory: web
        run: npm run build
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked
      - name: cargo build
        run: cargo build --locked
      # The unit tests' own binary, for the ignored live tests, such as the
      # anonymous read of a public repository on Fedora Forge. Picked by
      # its kind, so a library or integration tests added later don't
      # change which one it is.
      - name: Keep the test binary
        run: |
          TESTS=$(cargo test --locked --no-run --message-format=json | jq -rs '[.[] | select(.profile.test? and .executable and .target.kind == ["bin"])] | if length == 1 then .[0].executable else error("expected one bin test executable, found \(length)") end')
          cp "${TESTS}" target/debug/workboard-tests
      # For live tests on a machine that only runs what CI built.
      - name: Upload the debug binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workboard-debug
          path: |
            target/debug/workboard
            target/debug/workboard-tests
          retention-days: 1
          if-no-files-found: error
      - name: Smoke test
        run: python3 tests/smoke.py target/debug/workboard
      - name: Hub and companion smoke test
        run: python3 tests/hub_smoke.py target/debug/workboard

  # The hub's release image, built as release.yml builds it, but not pushed,
  # and run with its smoke test.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          tags: localhost/workboard:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Docker publishes ports to the container's address, not its loopback
      # where the service listens, so the test shares the host's network.
      - name: Smoke test the image
        run: python3 tests/image_smoke.py localhost/workboard:ci --engine docker --network host

  # Credentials in the Secret Service, against GNOME Keyring in a session
  # bus of the job's own, unlocked with an empty password.
  keyring:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install Rust and GNOME Keyring
        run: dnf -y install --setopt=install_weak_deps=False cargo gcc git gnome-keyring dbus-daemon shadow-utils util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As a user, as in a desktop session: gnome-keyring-daemon refuses
      # to run as root in a container, where it can't drop capabilities.
      # The page isn't needed here, but rust-embed wants its directory.
      - name: Secret Service round trip
        run: |
          mkdir -p web/dist
          useradd --create-home tester
          chown -R tester .
          runuser -u tester -- dbus-run-session -- sh tests/keyring_session.sh cargo test --locked secret_service -- --ignored --nocapture

  # The GNOME app, on Fedora, as in jmarrero's toolbox: GTK 4 and
  # libadwaita as Fedora ships them, newer than Ubuntu's.
  gnome:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install GTK, libadwaita and Rust
        run: dnf -y install --setopt=install_weak_deps=False cargo clippy rustfmt gcc git gtk4-devel libadwaita-devel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gnome
      - name: clippy
        run: cargo clippy --locked -p workboard-gnome --all-targets -- -D warnings
      # The API client and the view models, without a display.
      - name: cargo test
        run: cargo test --locked -p workboard-gnome
      - name: cargo build
        run: cargo build --locked -p workboard-gnome
      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workboard-gnome-debug
          path: target/debug/workboard-gnome
          retention-days: 1
          if-no-files-found: error

  # The app against a companion and a hub, on a virtual X server, with
  # screenshots of its views for review.
  gnome-smoke:
    needs: [build, gnome]
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install GTK, libadwaita, an X server and tools
        run: >-
          dnf -y install --setopt=install_weak_deps=False gtk4 libadwaita adwaita-icon-theme
          adwaita-sans-fonts glib2 dbus-daemon python3 python3-gobject xorg-x11-server-Xvfb
          python3-xlib ImageMagick xdotool
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workboard-debug
          path: target/debug
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workboard-gnome-debug
          path: target/debug
      - name: Smoke test and screenshots
        run: |
          chmod +x target/debug/workboard target/debug/workboard-gnome
          dbus-run-session -- python3 tests/gnome_smoke.py target/debug/workboard target/debug/workboard-gnome screenshots
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gnome-screenshots
          path: screenshots
          retention-days: 30
          if-no-files-found: warn

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      # The runner's preinstalled SDKs, mounted to be removed: the
      # runtime, the SDK and the build don't fit next to them.
      options: >-
        --privileged -v /usr/share/dotnet:/unused/dotnet -v /usr/local/lib/android:/unused/android
        -v /opt/hostedtoolcache:/unused/toolcache -v /opt/ghc:/unused/ghc
    steps:
      - name: Free disk space
        run: |
          rm -rf /unused/*/*
          df -h /__w
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: gnome/io.github.jmarrero_bot.Workboard.yml
          bundle: workboard-gnome.flatpak
          # A restored cache would take the space of a build again.
          cache: false

  # The one job that decides whether a change may merge. It runs always(),
  # even when a job it needs failed or the run was cancelled, and fails
  # unless every job it needs succeeded. List every job above in needs.
  ci:
    if: always()
    needs: [fmt, build, image, keyring, gnome, gnome-smoke, flatpak]
    runs-on: ubuntu-latest
    steps:
      - name: Check the jobs it needs
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          FAILED=$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<<"${NEEDS}")
          if [ -n "${FAILED}" ]; then
            echo "These jobs did not succeed: ${FAILED}"
            exit 1
          fi
