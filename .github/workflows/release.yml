# Publishes the hub's image to ghcr.io for a `v*` tag, attests its build
# provenance, and smoke-tests the pushed digest. Deployments pin that
# digest; see docs/release.md.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  # ghcr.io/OWNER/REPO, or the repository variable IMAGE_NAME in its place
  # (lowercase, under the repository owner's namespace, which is where the
  # job's token can push); see docs/run-your-own.md.
  IMAGE: ghcr.io/${{ vars.IMAGE_NAME || github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tag's name and the OCI labels, among them the source repository,
      # which links the package to it. No `latest`: deployments pin digests.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=ref,event=tag
          flavor: latest=false
      # Built and smoke-tested before anything is pushed, so a broken image
      # never reaches the registry.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          load: true
          tags: localhost/workboard:release
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Smoke test the image
        run: python3 tests/image_smoke.py localhost/workboard:release --engine docker --network host
      # The same build again, from the builder's cache, now pushed. One
      # manifest, not an index: buildx's own provenance would add one, and
      # the attestation below takes its place.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      # The pushed image's config can differ from the one tested above (its
      # creation time), so the digest that gets pinned is tested too.
      - name: Smoke test the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "${IMAGE}@${DIGEST}"
          python3 tests/image_smoke.py "${IMAGE}@${DIGEST}" --engine docker --network host
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          # Storage records are for organization-owned repositories only.
          create-storage-record: false
      - name: Print the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "Image=${IMAGE}@${DIGEST}"
          printf '%s\n' "## ${TAG}" '' 'For the deployment to pin:' '' '```' "Image=${IMAGE}@${DIGEST}" '```' >> "${GITHUB_STEP_SUMMARY}"
      # Deployments pull the image without credentials, so the package
      # must stay public; only the web UI changes that (docs/release.md).
      - name: Check that anyone can pull it
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker logout ghcr.io
          if ! docker manifest inspect "${IMAGE}@${DIGEST}" > /dev/null; then
            echo "::warning::${IMAGE} is not public. Make it public under the package's settings (docs/release.md)."
          fi
