[package]
name = "workboard-gnome"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A GNOME companion app for the local Workboard service"
repository = "https://github.com/jmarrero-bot/work-tracker-poc"
# The version libadwaita-rs 0.9 and gtk4-rs 0.11 need.
rust-version = "1.92"

[[bin]]
name = "workboard-gnome"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# GNOME 47 (GTK 4.16, libadwaita 1.6) or newer, as in RHEL 10, Fedora and
# the GNOME 50 Flatpak runtime the manifest uses.
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.11", features = ["gnome_47"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[dev-dependencies]
tempfile = "3"
