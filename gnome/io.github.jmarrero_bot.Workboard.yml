# Build: flatpak-builder --user --install --force-clean build-dir gnome/io.github.jmarrero_bot.Workboard.yml
#
# A build of your own: copy this file next to it as YOUR.APP.ID.yml and
# change `id` below. The build takes the app ID from there (FLATPAK_ID),
# so nothing else changes (see docs/run-your-own.md).
id: io.github.jmarrero_bot.Workboard
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: workboard-gnome
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # The service's private socket, in the session's runtime directory, which
  # is all the app talks to: no network. Read-only, since connecting to a
  # socket needs no write access to its file system. The data directory,
  # with the database and the credentials, stays out of the sandbox.
  - --filesystem=xdg-run/workboard:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  # Cargo fetches the crates in Cargo.lock while building. A Flathub build
  # would vendor them instead (flatpak-cargo-generator).
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/workboard-gnome/cargo
modules:
  - name: workboard-gnome
    buildsystem: simple
    build-commands:
      - make -C gnome install PREFIX=/app APP_ID="$FLATPAK_ID"
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - web/node_modules
          - .flatpak-builder
